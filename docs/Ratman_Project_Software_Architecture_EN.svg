<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="920" viewBox="0 0 1660 920">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#55748b"/></marker></defs>
<rect width="1660" height="920" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17354d">
<rect x="50" y="25" width="1560" height="65" rx="12" fill="#dae6f0" stroke="#aec1d0"/>
<text x="66" y="59" font-size="26" font-weight="bold">Ratman project | LAZ Underwater Object Detection</text>
<rect x="50" y="120" width="1560" height="110" rx="12" fill="#e8eafa" stroke="#aec1d0"/>
<text x="66" y="154" font-size="21" font-weight="bold">Desktop interface and job queue</text>
<text x="66" y="188" font-size="16">Select files, models and settings | Train and evaluate | Process one file or a batch</text>
<text x="66" y="215" font-size="16">View | Show objects | Select object IDs | Progress and error log</text>
<rect x="50" y="310" width="280" height="190" rx="12" fill="#dceefa" stroke="#aec1d0"/>
<text x="66" y="344" font-size="21" font-weight="bold">1  Import and validate</text>
<text x="66" y="378" font-size="16">LAS / LAZ</text>
<text x="66" y="405" font-size="16">laspy + lazrs + pyproj</text>
<text x="66" y="432" font-size="16">Fields, CRS and metric units</text>
<text x="66" y="459" font-size="16">Keep original points and indices</text>
<rect x="370" y="310" width="280" height="190" rx="12" fill="#dceefa" stroke="#aec1d0"/>
<text x="386" y="344" font-size="21" font-weight="bold">2  Prepare features</text>
<text x="386" y="378" font-size="16">NumPy + SciPy</text>
<text x="386" y="405" font-size="16">Local geometry and intensity</text>
<text x="386" y="432" font-size="16">Return structure and scan angle</text>
<text x="386" y="459" font-size="16">Full resolution for processing</text>
<rect x="690" y="310" width="280" height="190" rx="12" fill="#ddefe2" stroke="#aec1d0"/>
<text x="706" y="344" font-size="21" font-weight="bold">3  Model inference</text>
<text x="706" y="378" font-size="16">scikit-learn</text>
<text x="706" y="405" font-size="16">Random Forest (default)</text>
<text x="706" y="432" font-size="16">MLP feature network (optional)</text>
<text x="706" y="459" font-size="16">Point classes and class scores</text>
<rect x="1010" y="310" width="280" height="190" rx="12" fill="#ddefe2" stroke="#aec1d0"/>
<text x="1026" y="344" font-size="21" font-weight="bold">4  Instances and IDs</text>
<text x="1026" y="378" font-size="16">Per-class DBSCAN</text>
<text x="1026" y="405" font-size="16">IDs, point counts and centroids</text>
<text x="1026" y="432" font-size="16">Intensity and confidence</text>
<text x="1026" y="459" font-size="16">Area requires an agreed method</text>
<rect x="1330" y="310" width="280" height="190" rx="12" fill="#fff0d7" stroke="#aec1d0"/>
<text x="1346" y="344" font-size="21" font-weight="bold">5  Export and cache</text>
<text x="1346" y="378" font-size="16">XYZ CSV for each object</text>
<text x="1346" y="405" font-size="16">report.csv for each dataset</text>
<text x="1346" y="432" font-size="16">JSON metadata and NPZ cache</text>
<text x="1346" y="459" font-size="16">Reopen without rerunning</text>
<rect x="50" y="590" width="920" height="150" rx="12" fill="#ddefe2" stroke="#aec1d0"/>
<text x="66" y="624" font-size="21" font-weight="bold">Supervised training and model management</text>
<text x="66" y="658" font-size="16">Annotate independent scenes and separate train / validation / test data</text>
<text x="66" y="685" font-size="16">Extract features, train RF / MLP, validate, and save the model with its configuration</text>
<text x="66" y="712" font-size="16">Test evaluation starts explicitly; annotation editing is outside this prototype</text>
<rect x="1010" y="590" width="600" height="150" rx="12" fill="#fff0d7" stroke="#aec1d0"/>
<text x="1026" y="624" font-size="21" font-weight="bold">Interactive 3D viewer (Matplotlib)</text>
<text x="1026" y="658" font-size="16">Read saved cache | Rotate, zoom and pan</text>
<text x="1026" y="685" font-size="16">Toggle instance colours | Select the matching object ID</text>
<text x="1026" y="712" font-size="16">Display sampling only; exports use all assigned original points</text>
<polyline points="830,230 830,310" fill="none" stroke="#55748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="330,405.0 370,405.0" fill="none" stroke="#55748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="650,405.0 690,405.0" fill="none" stroke="#55748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="970,405.0 1010,405.0" fill="none" stroke="#55748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1290,405.0 1330,405.0" fill="none" stroke="#55748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="830,590 830,500" fill="none" stroke="#55748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1470,500 1470,590" fill="none" stroke="#55748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="790" width="1560" height="110" rx="12" fill="#f4f6f9" stroke="#aec1d0"/>
<text x="66" y="824" font-size="20" font-weight="bold">Scope and next steps</text>
<text x="66" y="858" font-size="16">Prototype: one local process; no server or database. RF / MLP are integrated; Pointcept and SoftGroup are not.</text>
<text x="66" y="885" font-size="16">Next: real Ratman project validation, deep point-cloud models, waveform decoding, large-cloud tiling and Linux acceptance testing.</text>
</g></svg>